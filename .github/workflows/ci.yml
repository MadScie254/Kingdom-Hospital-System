name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          # The build only needs values to exist. Nothing here connects to a database or to SHA.
          DATABASE_URL: postgresql://ci:ci@localhost/ci?sslmode=disable
          AUTH_SECRET: ci-only-secret-0123456789abcdef0123456789abcdef
          NEXT_TELEMETRY_DISABLED: "1"
